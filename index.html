<title>Kho Acc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* Layout: sticky toolbar (count · search · actions) over a single scrolling column of tap-to-copy account rows */
  :root {
    --bg: #eef0f4;
    --surface: #ffffff;
    --surface-2: #f6f7fa;
    --fg: #15171c;
    --muted: #697086;
    --line: #dfe3ea;
    --accent: #4f46e5;
    --accent-soft: #eceaff;
    --ok: #0f9d58;
    --ok-soft: #e4f5ea;
    --used: #9aa1b2;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,24,40,.06), 0 6px 20px rgba(20,24,40,.05);
    --fdisp: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --fbody: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --fmono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1016;
      --surface: #171a22;
      --surface-2: #1e222c;
      --fg: #e9ebf1;
      --muted: #8b93a7;
      --line: #2a2f3b;
      --accent: #8b93ff;
      --accent-soft: #272a46;
      --ok: #45d07f;
      --ok-soft: #16331f;
      --used: #5a6072;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1016;
    --surface: #171a22;
    --surface-2: #1e222c;
    --fg: #e9ebf1;
    --muted: #8b93a7;
    --line: #2a2f3b;
    --accent: #8b93ff;
    --accent-soft: #272a46;
    --ok: #45d07f;
    --ok-soft: #16331f;
    --used: #5a6072;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--fbody);
    margin: 0;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 96px;
  }

  /* ---- toolbar ---- */
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(140%) blur(12px);
    -webkit-backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--line);
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding: 10px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px));
  }
  .bar-top { display: flex; align-items: baseline; gap: 10px; }
  h1 {
    font-family: var(--fdisp);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -.01em;
    margin: 0;
  }
  .count {
    font-size: .8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-left: auto;
    white-space: nowrap;
  }
  .count b { color: var(--accent); font-weight: 600; }

  .controls { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .search {
    flex: 1;
    min-width: 0;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 0 12px;
    height: 42px;
  }
  .search svg { flex: none; color: var(--muted); }
  .search input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    color: var(--fg); font-size: 1rem; font-family: var(--fbody);
    height: 100%;
  }
  .iconbtn {
    flex: none;
    height: 42px; min-width: 42px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    border-radius: 11px;
    font-size: .85rem; font-weight: 500; font-family: var(--fbody);
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .iconbtn:active { background: var(--surface-2); }
  .iconbtn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .iconbtn svg { flex: none; }

  /* ---- list ---- */
  ul { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: opacity .15s;
  }
  .card.used { opacity: .5; }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .idx {
    font-family: var(--fmono);
    font-size: .72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .markbtn {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 10px 4px 8px;
    font-size: .72rem; font-weight: 500;
    cursor: pointer;
  }
  .markbtn .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--used); flex: none; display: inline-flex; align-items:center; justify-content:center; }
  .card.used .markbtn { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .card.used .markbtn .dot { background: var(--ok); border-color: var(--ok); }

  .field {
    display: flex; align-items: center; gap: 10px;
    padding: 12px;
    width: 100%;
    border: 0; background: transparent;
    text-align: left; cursor: pointer; color: var(--fg);
    font-family: var(--fbody);
    -webkit-tap-highlight-color: transparent;
  }
  .field + .field { border-top: 1px dashed var(--line); }
  .field:active { background: var(--surface-2); }
  .tag {
    flex: none;
    width: 42px;
    font-size: .64rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .val {
    flex: 1; min-width: 0;
    font-family: var(--fmono);
    font-size: 1.02rem;
    word-break: break-all;
    line-height: 1.3;
  }
  .val.mask { letter-spacing: .12em; }
  .copyhint {
    flex: none;
    color: var(--muted);
    display: inline-flex;
    transition: color .12s, transform .12s;
  }
  .field:active .copyhint { color: var(--accent); }
  .field.just .copyhint { color: var(--ok); }
  .field.just .val { color: var(--ok); }

  /* ---- importer ---- */
  details.importer {
    margin-top: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  details.importer > summary {
    list-style: none; cursor: pointer;
    padding: 13px 14px;
    display: flex; align-items: center; gap: 10px;
    font-weight: 500; font-size: .92rem;
  }
  details.importer > summary::-webkit-details-marker { display: none; }
  details.importer > summary .chev { margin-left: auto; color: var(--muted); transition: transform .18s; }
  details.importer[open] > summary .chev { transform: rotate(180deg); }
  .importer-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface-2);
    color: var(--fg);
    font-family: var(--fmono);
    font-size: .88rem;
    padding: 11px 12px;
    outline: 0;
  }
  textarea:focus { border-color: var(--accent); }
  .imp-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 120px;
    height: 44px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    font-weight: 600; font-size: .9rem; font-family: var(--fbody);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:active { filter: brightness(.94); }
  .hint { font-size: .78rem; color: var(--muted); line-height: 1.5; }
  .hint code { font-family: var(--fmono); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 16px;
    font-size: .92rem;
  }

  /* ---- toast ---- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(24px);
    background: var(--fg);
    color: var(--bg);
    font-weight: 600; font-size: .9rem;
    padding: 11px 18px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
    z-index: 50;
    display: inline-flex; align-items: center; gap: 8px;
    max-width: calc(100% - 32px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast svg { flex: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="wrap">
  <header>
    <div class="bar-top">
      <h1>Kho Acc</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" inputmode="search" placeholder="Tìm user…" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <button class="iconbtn" id="eye" title="Ẩn/hiện pass" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>

  <details class="importer" id="importer">
    <summary>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Dán / nạp danh sách
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="importer-body">
      <textarea id="ta" spellcheck="false" autocapitalize="off" placeholder="user|pass&#10;user|pass&#10;…"></textarea>
      <div class="imp-row">
        <button class="btn primary" id="load">Nạp danh sách</button>
        <button class="btn" id="pick">Mở file .txt</button>
        <input id="file" type="file" accept=".txt,text/plain" hidden>
      </div>
      <div class="imp-row">
        <button class="btn" id="append">Thêm nối tiếp</button>
        <button class="btn" id="clearused">Bỏ hết đánh dấu</button>
      </div>
      <p class="hint">Mỗi dòng một acc. Tách user/pass bằng <code>|</code> (cũng nhận <code>:</code>, tab hoặc dấu cách). Dữ liệu chỉ nằm trên máy mày, không gửi đi đâu.</p>
    </div>
  </details>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var LS_DATA = "khoacc.raw";
  var LS_USED = "khoacc.used";

  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var countEl = document.getElementById("count");
  var searchEl = document.getElementById("search");
  var eyeBtn = document.getElementById("eye");
  var ta = document.getElementById("ta");
  var importer = document.getElementById("importer");
  var toastEl = document.getElementById("toast");

  var accounts = [];     // {user, pass}
  var used = {};         // user -> true
  var revealed = false;
  var filter = "";

  // ---------- storage ----------
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function loadUsed() {
    var raw = load(LS_USED);
    if (!raw) return;
    try { used = JSON.parse(raw) || {}; } catch (e) { used = {}; }
  }
  function saveUsed() { store(LS_USED, JSON.stringify(used)); }

  // ---------- parsing ----------
  function splitLine(line) {
    var s = line.trim();
    if (!s) return null;
    var sep = null, i;
    if (s.indexOf("|") >= 0) sep = "|";
    else if (s.indexOf("\t") >= 0) sep = "\t";
    else if (s.indexOf(":") >= 0) sep = ":";
    if (sep) {
      i = s.indexOf(sep);
      return { user: s.slice(0, i).trim(), pass: s.slice(i + 1).trim() };
    }
    // fallback: first run of whitespace
    var m = s.match(/^(\S+)\s+(.+)$/);
    if (m) return { user: m[1], pass: m[2].trim() };
    return { user: s, pass: "" };
  }

  function parse(text) {
    var out = [], lines = String(text).split(/\r?\n/), i, r;
    for (i = 0; i < lines.length; i++) {
      r = splitLine(lines[i]);
      if (r) out.push(r);
    }
    return out;
  }

  function setData(text, append) {
    var parsed = parse(text);
    accounts = append ? accounts.concat(parsed) : parsed;
    store(LS_DATA, serialize());
    render();
  }

  function serialize() {
    return accounts.map(function (a) { return a.user + "|" + a.pass; }).join("\n");
  }

  // ---------- clipboard ----------
  function copy(text, label) {
    function done() { toast(label); }
    function fallback() {
      try {
        var t = document.createElement("textarea");
        t.value = text;
        t.style.position = "fixed";
        t.style.top = "-1000px";
        document.body.appendChild(t);
        t.focus(); t.select(); t.setSelectionRange(0, text.length);
        document.execCommand("copy");
        document.body.removeChild(t);
        done();
      } catch (e) {
        toast("Không copy được — bấm giữ để chọn", true);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  var toastTimer = null;
  var checkSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  function toast(msg, warn) {
    toastEl.innerHTML = (warn ? "" : checkSvg) + "<span></span>";
    toastEl.querySelector("span").textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1400);
  }

  // ---------- render ----------
  function matches(a) {
    if (!filter) return true;
    return (a.user + " " + a.pass).toLowerCase().indexOf(filter) >= 0;
  }

  function render() {
    listEl.innerHTML = "";
    var shown = 0, usedCount = 0, i, a;

    for (i = 0; i < accounts.length; i++) {
      if (used[accounts[i].user]) usedCount++;
    }

    for (i = 0; i < accounts.length; i++) {
      a = accounts[i];
      if (!matches(a)) continue;
      shown++;
      listEl.appendChild(makeCard(a, i));
    }

    var total = accounts.length;
    countEl.innerHTML = total
      ? '<b>' + total + '</b> acc · ' + usedCount + ' đã xài'
      : "";

    if (!total) {
      emptyEl.hidden = false;
      emptyEl.textContent = "Chưa có acc nào — dán list vào ô bên dưới rồi bấm “Nạp danh sách”.";
    } else if (!shown) {
      emptyEl.hidden = false;
      emptyEl.textContent = "Không có acc nào khớp “" + filter + "”.";
    } else {
      emptyEl.hidden = true;
    }
  }

  function makeField(tag, value, label) {
    var btn = document.createElement("button");
    btn.className = "field";
    btn.type = "button";

    var t = document.createElement("span");
    t.className = "tag";
    t.textContent = tag;

    var v = document.createElement("span");
    v.className = "val";
    var isPass = tag === "pass";
    if (isPass && !revealed && value) {
      v.classList.add("mask");
      v.textContent = "•".repeat(Math.min(value.length, 12));
    } else {
      v.textContent = value || "—";
    }

    var hint = document.createElement("span");
    hint.className = "copyhint";
    hint.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

    btn.appendChild(t);
    btn.appendChild(v);
    btn.appendChild(hint);

    btn.addEventListener("click", function () {
      if (!value) return;
      copy(value, "Copy " + label);
      btn.classList.add("just");
      setTimeout(function () { btn.classList.remove("just"); }, 700);
    });
    return btn;
  }

  function makeCard(a, index) {
    var li = document.createElement("li");
    li.className = "card" + (used[a.user] ? " used" : "");

    var head = document.createElement("div");
    head.className = "card-head";

    var idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = "#" + (index + 1);

    var mark = document.createElement("button");
    mark.className = "markbtn";
    mark.type = "button";
    mark.innerHTML = '<span class="dot">' +
      (used[a.user] ? '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : '') +
      '</span><span>' + (used[a.user] ? "đã xài" : "đánh dấu") + '</span>';
    mark.addEventListener("click", function (e) {
      e.stopPropagation();
      if (used[a.user]) delete used[a.user]; else used[a.user] = true;
      saveUsed();
      render();
    });

    head.appendChild(idx);
    head.appendChild(mark);

    li.appendChild(head);
    li.appendChild(makeField("user", a.user, "user"));
    li.appendChild(makeField("pass", a.pass, "pass"));
    return li;
  }

  // ---------- events ----------
  searchEl.addEventListener("input", function () {
    filter = searchEl.value.trim().toLowerCase();
    render();
  });

  eyeBtn.addEventListener("click", function () {
    revealed = !revealed;
    eyeBtn.classList.toggle("on", revealed);
    eyeBtn.setAttribute("aria-pressed", revealed ? "true" : "false");
    render();
  });

  document.getElementById("load").addEventListener("click", function () {
    setData(ta.value, false);
    importer.open = false;
    toast(accounts.length + " acc đã nạp");
  });
  document.getElementById("append").addEventListener("click", function () {
    if (!ta.value.trim()) { toast("Chưa có gì để thêm", true); return; }
    setData(ta.value, true);
    importer.open = false;
    toast("Đã thêm nối tiếp");
  });
  document.getElementById("clearused").addEventListener("click", function () {
    used = {}; saveUsed(); render();
    toast("Đã bỏ hết đánh dấu");
  });

  document.getElementById("pick").addEventListener("click", function () {
    document.getElementById("file").click();
  });
  document.getElementById("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      ta.value = String(reader.result || "");
      setData(ta.value, false);
      importer.open = false;
      toast(accounts.length + " acc từ file");
    };
    reader.readAsText(f);
  });

  // ---------- boot ----------
  loadUsed();
  var saved = load(LS_DATA);
  var initial = (saved && saved.trim()) ? saved : "";
  ta.value = initial;
  accounts = parse(initial);
  render();
  if (!accounts.length) importer.open = true;
})();
</script>
